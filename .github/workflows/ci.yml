name : TruthLens CI Pipeline 

on: 
  push: 
    branches: ["main"]
  pull_requests: 
    branches: ["main"]

jobs: 
  validate-and-test: 
    name: Build & Validate 
    runs-on: ubuntu-latest 

    steps: 
    - name : Checkout Code 
      uses: actions/checkout@v4 

    - name: Setup uv 
      uses: astra-sh/setup-uv@v3 
      with: 
        enable-cache: true 

    - name: Setup Python 3.12 
      uses: actions/setup-python@v5 
      with: 
        python-version: "3.12"

    - name: Install Dependencies
      run: | 
        uv sync
        uv add ruff pytest httpx 

    - name: Lint Code with Ruff 
      run: | 
        uv run ruff check . 

    - name: FastAPI Boot Check
      env: 
        GROQ_API_KEY: "dummy_key"
        TAVILY_API_KEY: "dummy_key"
        GOOGLE_API_KEY: "dummy_key"   
      run: | 
        uv run unvicorn app.main:app --port 8000 & 
        sleep 3 

        curl -f http://127.0.0.1:8000/health || exit 1 
